{{define "content"}}
<div class="error-page">
  <span class="error-code">{{.Data.Code}}</span>
  <h1>{{if eq .Data.Code 404}}Page not found{{else if eq .Data.Code 403}}You can't do that{{else if eq .Data.Code 422}}That didn't work{{else}}Something went wrong{{end}}</h1>
  <p>{{.Data.Message}}</p>
  <div class="btn-row"><a class="btn primary" href="/explore">Explore projects</a><a class="btn" href="/">Go home</a></div>
</div>
{{end}}
